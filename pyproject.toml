[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "biosimulant-model-compatibility-standard"
version = "0.1.0"
description = "Versioned scientific interface profiles for Biosimulant models"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Biosimulant" }]
dependencies = ["PyYAML>=6.0.2,<7"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.optional-dependencies]
test = ["build>=1.2", "pytest>=8"]

[project.urls]
Homepage = "https://github.com/Biosimulant/model-compatibility-standard"
Repository = "https://github.com/Biosimulant/model-compatibility-standard"

[tool.hatch.build.targets.sdist]
include = [
  "/standard.yaml",
  "/profiles",
  "/src",
  "/tests",
  "/README.md",
  "/CONTRIBUTING.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/SECURITY.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/biosimulant_model_compatibility_standard"]

[tool.hatch.build.targets.wheel.force-include]
"standard.yaml" = "biosimulant_model_compatibility_standard/data/standard.yaml"
"profiles" = "biosimulant_model_compatibility_standard/data/profiles"

[tool.pytest.ini_options]
testpaths = ["tests"]
