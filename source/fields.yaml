schema_version: "0.1"
defaults:
  description: Checked only when the profile requires it or both contracts include it.
  comparison: equal
  ordered: true

fields:
  - path: artifact.format
    family: artifact
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: artifact.format_version
    family: artifact
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: artifact.media_type
    family: artifact
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: artifact.schema_ref
    family: artifact
    schema: {type: string, format: uri}
  - path: artifact.schema_sha256
    family: artifact
    schema: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
  - path: artifact.sha256
    family: artifact
    schema: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
    comparison: digest-equal

  - path: biological_context.compartment
    family: biological_context
    schema: {type: string, minLength: 1, maxLength: 4096}
    comparison: context-compatible
  - path: biological_context.species
    family: biological_context
    schema:
      type: string
      anyOf:
        - const: any
        - pattern: "^NCBITaxon:[1-9][0-9]*$"
    comparison: context-compatible

  - path: dimensions.axes
    family: dimensions
    schema:
      type: array
      minItems: 1
      items:
        anyOf:
          - {type: string, minLength: 1}
          - type: object
            required: [name]
            additionalProperties: false
            properties:
              name: {type: string, minLength: 1}
              meaning: {type: string, minLength: 1}
              size: {type: integer, minimum: 0}
              unit: {type: string, minLength: 1}
              ordering: {type: string, minLength: 1}
              dynamic: {type: boolean}
              labels_ref: {type: string, format: uri}
              labels_sha256: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
              coordinates_ref: {type: string, format: uri}
    comparison: labels-equal
  - path: dimensions.axes[].labels_ref
    family: dimensions
    schema: {type: string, format: uri}
  - path: dimensions.axes[].labels_sha256
    family: dimensions
    schema: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
  - path: dimensions.axes[].meaning
    family: dimensions
    schema: {type: string, minLength: 1}
  - path: dimensions.axes[].name
    family: dimensions
    schema: {type: string, minLength: 1}
  - path: dimensions.axes[].ordering
    family: dimensions
    schema: {type: string, minLength: 1}
  - path: dimensions.axes[].size
    family: dimensions
    schema: {type: integer, minimum: 0}
  - path: dimensions.axes[].unit
    family: dimensions
    schema: {type: string, minLength: 1}
    comparison: unit-convertible

  - path: identifiers.mapping_refs
    family: identifiers
    schema:
      type: array
      minItems: 1
      items:
        type: object
        required: [ref, sha256, source_namespace, target_namespace, release]
        additionalProperties: false
        properties:
          ref: {type: string, format: uri}
          sha256: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
          source_namespace: {type: string, minLength: 1}
          target_namespace: {type: string, minLength: 1}
          release: {type: string, minLength: 1}
          coverage: {type: number, minimum: 0, maximum: 1}
          cardinality: {type: string, minLength: 1}
          license: {type: string, minLength: 1}
    comparison: term-equivalent
    ordered: false
  - path: identifiers.mapping_refs[].cardinality
    family: identifiers
    schema: {type: string, minLength: 1}
    comparison: term-equivalent
  - path: identifiers.mapping_refs[].coverage
    family: identifiers
    schema: {type: number, minimum: 0, maximum: 1}
    comparison: mapping-total
  - path: identifiers.mapping_refs[].license
    family: identifiers
    schema: {type: string, minLength: 1}
    comparison: term-equivalent
  - path: identifiers.mapping_refs[].ref
    family: identifiers
    schema: {type: string, format: uri}
    comparison: term-equivalent
  - path: identifiers.mapping_refs[].release
    family: identifiers
    schema: {type: string, minLength: 1}
    comparison: term-equivalent
  - path: identifiers.mapping_refs[].sha256
    family: identifiers
    schema: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
    comparison: term-equivalent
  - path: identifiers.mapping_refs[].source_namespace
    family: identifiers
    schema: {type: string, minLength: 1}
    comparison: term-equivalent
  - path: identifiers.mapping_refs[].target_namespace
    family: identifiers
    schema: {type: string, minLength: 1}
    comparison: term-equivalent
  - path: identifiers.namespace
    family: identifiers
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: identifiers.namespace_version
    family: identifiers
    schema: {type: string, minLength: 1, maxLength: 4096}
    comparison: namespace-version-compatible
  - path: identifiers.structure_hash
    family: identifiers
    schema: {type: string, minLength: 1, maxLength: 4096}
    comparison: term-equivalent

  - path: lifecycle.temporal_meaning
    family: lifecycle
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: lifecycle.time_unit
    family: lifecycle
    schema: {type: string, minLength: 1, maxLength: 128}

  - path: measurement.normalization
    family: measurement
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: measurement.quantity
    family: measurement
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: measurement.scale
    family: measurement
    schema:
      enum: [nominal, ordinal, interval, ratio, proportion, probability, count]
  - path: measurement.transform
    family: measurement
    description: Checked when the profile requires it or both contracts include it. A log2 and a log10 value of the same quantity are different numbers.
    schema:
      enum: [identity, log2, log10, ln, logit]
  - path: measurement.unit
    family: measurement
    schema: {type: string, minLength: 1, maxLength: 128}
    comparison: unit-convertible

  - path: origin.method
    family: origin
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: origin.method_version
    family: origin
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: origin.software
    family: origin
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: origin.software_version
    family: origin
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: origin.source_ref
    family: origin
    schema: {type: string, format: uri}
  - path: origin.source_sha256
    family: origin
    schema: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
  - path: origin.type
    family: origin
    schema: {type: string, minLength: 1, maxLength: 4096}

  - path: representation.alphabet
    family: representation
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: representation.canonicalization
    family: representation
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: representation.coordinate_system
    family: representation
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: representation.encoding
    family: representation
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: representation.formal_charge
    family: representation
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: representation.isotope_state
    family: representation
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: representation.kind
    family: representation
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: representation.normalization_tool
    family: representation
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: representation.normalization_version
    family: representation
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: representation.precision
    family: representation
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: representation.protonation_state
    family: representation
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: representation.stereochemistry
    family: representation
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: representation.structure_format
    family: representation
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: representation.syntax_features
    family: representation
    description: >
      Optional syntax features that an output may emit, or that an input can
      accept without discarding their meaning. Every feature declared by the
      output must be accepted by the input.
    schema:
      type: array
      uniqueItems: true
      maxItems: 4
      items:
        enum: [atom-classes, disconnected-components, isotopes, stereochemistry]
    comparison: subset
    ordered: false
  - path: representation.tautomer_state
    family: representation
    schema: {type: string, minLength: 1, maxLength: 4096}

  - path: semantic.concept
    family: semantic
    schema: {type: string, minLength: 1, maxLength: 4096}
  - path: semantic.intended_use
    family: semantic
    schema: {type: string, minLength: 1, maxLength: 4096}
    comparison: term-equivalent
  - path: semantic.ontology_snapshot_ref
    family: semantic
    schema: {type: string, format: uri}
    comparison: term-equivalent
  - path: semantic.ontology_snapshot_sha256
    family: semantic
    schema: {type: string, minLength: 1, maxLength: 4096}
    comparison: term-equivalent
  - path: semantic.ontology_terms
    family: semantic
    schema:
      type: array
      minItems: 1
      items:
        type: object
        required: [uri, ontology, version]
        additionalProperties: false
        properties:
          uri: {type: string, format: uri}
          ontology: {type: string, minLength: 1}
          version: {type: string, minLength: 1}
          label: {type: string, minLength: 1}
          relation: {type: string, minLength: 1}
    comparison: term-equivalent
    ordered: false
  - path: semantic.ontology_terms[].label
    family: semantic
    schema: {type: string, minLength: 1}
    comparison: term-equivalent
  - path: semantic.ontology_terms[].ontology
    family: semantic
    schema: {type: string, minLength: 1}
    comparison: term-equivalent
  - path: semantic.ontology_terms[].relation
    family: semantic
    schema: {type: string, minLength: 1}
    comparison: term-equivalent
  - path: semantic.ontology_terms[].uri
    family: semantic
    schema: {type: string, format: uri}
    comparison: term-equivalent
  - path: semantic.ontology_terms[].version
    family: semantic
    schema: {type: string, minLength: 1}
    comparison: term-equivalent
  - path: semantic.qualifiers
    family: semantic
    schema:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, minLength: 1}
    comparison: term-equivalent
    ordered: false
  - path: semantic.subject
    family: semantic
    schema: {type: string, minLength: 1, maxLength: 4096}

  - path: uncertainty.quality_flags
    family: uncertainty
    schema:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, minLength: 1}
    ordered: false
