schema_version: "0.1"
label: Protein Structure
domain_label: Proteome and protein structure
description: >
  A three-dimensional structural representation of a declared protein or
  protein-containing assembly, including the identity, coordinate
  representation and format needed to interpret the structure.
status: active
representations: [record, artifact]
intended_use: >
  Connecting a model output that provides a three-dimensional protein structure
  to a model input that consumes the same declared structural representation.
limitations:
  - It does not establish structural accuracy, biological function or fitness for a downstream claim.
  - A predicted structure is not treated as interchangeable with an experimental structure unless the target permits that origin.
sources:
  - title: PDBx/mmCIF Dictionary
    url: https://mmcif.wwpdb.org/
  - title: PDB file format documentation
    url: https://www.wwpdb.org/documentation/file-format
  - title: NCBI Taxonomy
    url: https://www.ncbi.nlm.nih.gov/taxonomy

fields:
  semantic.concept: required
  representation.kind: required
  representation.structure_format: required
  representation.coordinate_system: required
  identifiers.namespace: required
  identifiers.namespace_version: required
  biological_context.species: required
  origin.type: required
  semantic.ontology_terms: recommended
  semantic.qualifiers: recommended
  representation.precision: recommended
  origin.method: recommended
  origin.method_version: recommended
  origin.software: recommended
  origin.software_version: recommended
  origin.source_ref: recommended
  origin.source_sha256: recommended
  artifact.media_type: recommended
  artifact.format: recommended
  artifact.format_version: recommended
  artifact.schema_ref: recommended
  artifact.schema_sha256: recommended
  artifact.sha256: recommended
  uncertainty.quality_flags: recommended

examples:
  - id: BMCS-V0-006
    title: Different coordinate systems are incompatible
    check: compare
    source_patch: {representation: {coordinate_system: cartesian-angstrom}}
    target_patch: {representation: {coordinate_system: fractional-unit-cell}}
    expect: {status: INCOMPATIBLE}
    why: Coordinates in different systems cannot be consumed as if their numerical values have the same spatial meaning.
    conditions: Both ports declare different coordinate systems and no conversion is supplied.
    decision: V0 protein-structure profile
    report_finding: Contradictory coordinate representation
  - id: BMCS-V0-007
    title: Missing structure origin is unknown
    check: compare
    source_remove: [origin.type]
    expect: {status: UNKNOWN}
    why: Experimental, predicted and otherwise derived structures have different provenance and limitations.
    conditions: The source omits the structure origin required by the target contract.
    decision: V0 protein-structure profile
    report_finding: Missing structure provenance
  - id: BMCS-V0-009
    title: Identical protein-structure contracts are exact matches
    check: compare
    expect: {status: EXACT}
    why: The same complete structure declaration can connect without conversion or approval.
    conditions: Both ports make the same complete declarations for this profile.
    decision: V0 protein-structure profile
    report_finding: Positive baseline
