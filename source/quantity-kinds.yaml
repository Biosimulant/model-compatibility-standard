schema_version: "0.1"
note: >
  A unit alone does not identify a quantity: hertz and becquerel are both
  1/time, and a Hounsfield unit is dimensionless like a bare ratio. Each kind
  fixes a dimension through its canonical unit and may forbid units whose UCUM
  property belongs to a different quantity.
fields:
  canonical_unit: A UCUM expression that establishes the kind's dimension.
  forbidden_unit_properties: UCUM properties that are invalid for this quantity kind.
  allowed_units: An explicit allow-list for quantities defined by an assay rather than a dimension.
  affine: Whether an offset conversion describes an absolute value or a difference.

kinds:
  amount-concentration: {label: Amount-of-substance concentration, canonical_unit: umol/L}
  mass-concentration: {label: Mass concentration, canonical_unit: mg/L}
  activity-concentration: {label: Radioactivity concentration, canonical_unit: Bq/mL}
  mass: {label: Mass, canonical_unit: kg}
  atomic-mass: {label: Atomic or molecular mass, canonical_unit: u}
  molar-mass: {label: Molar mass, canonical_unit: g/mol}
  volume: {label: Volume, canonical_unit: L}
  length: {label: Length, canonical_unit: um}
  duration: {label: Duration, canonical_unit: s}
  frequency: {label: "Frequency, events per unit time", canonical_unit: Hz, forbidden_unit_properties: [radioactivity]}
  per-time-rate: {label: Per-capita or per-entity rate, canonical_unit: 1/h, forbidden_unit_properties: [radioactivity]}
  person-time-rate: {label: Events per person-time, canonical_unit: "/a{person}", forbidden_unit_properties: [radioactivity]}
  speed: {label: Speed, canonical_unit: um/min}
  volumetric-flow: {label: Volumetric flow, canonical_unit: L/s}
  bsa-clearance: {label: Clearance normalised to body surface area, canonical_unit: "mL/min/{1.73_m2}"}
  pressure: {label: Pressure, canonical_unit: "mm[Hg]"}
  temperature: {label: Absolute temperature, canonical_unit: Cel, affine: absolute}
  power: {label: "Power, energy per time", canonical_unit: W}
  association-rate-constant: {label: Second-order association rate constant, canonical_unit: "L/(mol.s)"}
  dissociation-rate-constant: {label: First-order dissociation rate constant, canonical_unit: 1/s, forbidden_unit_properties: [radioactivity]}
  molar-flux-per-biomass: {label: Metabolic flux per biomass, canonical_unit: "mmol/(g{DW}.h)"}
  amount-per-cell-per-time: {label: Secretion rate per cell, canonical_unit: "pg/({cell}.h)"}
  mass-per-area: {label: Areal density, canonical_unit: g/cm2}
  dose-mass: {label: "Administered dose, absolute", canonical_unit: mg}
  dose-per-body-mass: {label: Administered dose per body mass, canonical_unit: mg/kg}
  mass-to-charge-ratio: {label: Mass-to-charge ratio, canonical_unit: "1", forbidden_unit_properties: [x-ray attenuation, arbitrary]}
  xray-attenuation: {label: X-ray attenuation, canonical_unit: "[hnsf'U]", allowed_units: ["[hnsf'U]"]}
  infectious-titre: {label: Infectious titre, canonical_unit: "[PFU]/mL", allowed_units: ["[PFU]/mL", "[PFU]/L", "[TCID_50]/mL", "[FFU]/mL", "{FFU}/mL"]}
  dilution-titre: {label: "Endpoint dilution titre, reciprocal", canonical_unit: "1", forbidden_unit_properties: [x-ray attenuation, arbitrary]}
  standardised-activity: {label: Activity in international units, canonical_unit: "[IU]/mL", allowed_units: ["[IU]/mL", "[IU]/L", "{BAU}/mL"]}
  count: {label: A counted number of entities, canonical_unit: "1", forbidden_unit_properties: [x-ray attenuation, arbitrary]}
  proportion: {label: "A part of a declared whole, in [0,1]", canonical_unit: "1", forbidden_unit_properties: [x-ray attenuation, arbitrary]}
  dimensionless-ratio: {label: A dimensionless ratio with a true zero, canonical_unit: "1", forbidden_unit_properties: [x-ray attenuation, arbitrary]}
  arbitrary-intensity: {label: Instrument intensity in arbitrary units, canonical_unit: "1", forbidden_unit_properties: [x-ray attenuation]}
  score: {label: An instrument- or method-defined score, canonical_unit: "1", forbidden_unit_properties: [x-ray attenuation, arbitrary]}
  log-ratio: {label: "A logarithmic ratio, signed and unbounded", canonical_unit: "1", forbidden_unit_properties: [x-ray attenuation, arbitrary]}
  port-declared: {label: The port declares the quantity; the profile does not fix one, canonical_unit: null}
